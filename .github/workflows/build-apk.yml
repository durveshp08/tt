name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "scheduler.js"
      - "manifest.webmanifest"
      - "icon.svg"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create debug APK
        run: gradle -p android assembleDebug

      - name: Save the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Faculty-Timetable-Helper-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
